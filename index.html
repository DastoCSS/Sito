<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASTO DJ Napoli | Matrimoni ed Eventi Exclusive</title>
    <meta name="description" content="DJ professionista a Napoli. Techno, House e musica per matrimoni. Prezzi da €350. Attrezzatura Pioneer.">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "DASTO DJ Napoli",
      "telephone": "+393514090392",
      "address": { "@type": "PostalAddress", "addressLocality": "Napoli", "addressRegion": "Campania" }
    }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div id="lightbox" class="lightbox-overlay" onclick="closeReel()">
    <button class="close-lightbox">×</button>
    <div class="lightbox-content" onclick="event.stopPropagation()">
        <iframe id="lightbox-iframe" allowfullscreen></iframe>
    </div>
</div>

<main class="container">
    <header class="left">
        <div class="logo-container">
            <h1 class="logo">DASTO DJ</h1>
            <p class="subtitle">Napoli • Techno • House • Wedding</p>
        </div>

        <iframe class="soundcloud-frame" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/2251688624&visual=true" loading="lazy"></iframe>

        <nav>
            <h2 class="section-title">Identity</h2>
            <a href="https://wa.me/393514090392" class="btn whatsapp-btn" target="_blank">
                <i class="fa-brands fa-whatsapp"></i> BOOKING DIRETTO
            </a>
            <a href="pdf/Listino_Prezzi.pdf" class="btn" download><i class="fa-solid fa-euro-sign"></i> LISTINO PREZZI</a>
            <a href="pdf/press-kit.pdf" class="btn" download><i class="fa-regular fa-file-pdf"></i> PRESS KIT</a>
        </nav>
    </header>

    <div class="right">
        <section>
            <h2 class="section-title">Live Performance</h2>
            <div class="slider-container">
                <div class="slider-track" id="sliderTrack">
                    <div class="slide"><img src="img/dasto_dj_napoli_live_1.webp" alt="Dasto DJ Live"></div>
                    <div class="slide"><img src="img/dasto_dj_napoli_live_2.webp" alt="Dasto DJ Wedding"></div>
                </div>
            </div>
        </section>

       <section id="reels">
    <h2 class="section-title">Video Reels</h2>
    <div class="gallery">
        <div class="item reel" onclick="openReel('DKIOE1XIEEb')">
            <img src="img/copertina_GT.png" alt="DJ Set Napoli Techno Dasto" loading="lazy" class="reel-img">
            <div class="play-overlay">
                <i class="fa-solid fa-play"></i>
                <span>WATCH SET</span>
            </div>
        </div>

        <div class="item reel" onclick="openReel('DAvzNiBoFF-')">
            <img src="img/copertina_flashmob.png" alt="DJ Matrimonio Napoli Flashmob" loading="lazy" class="reel-img">
            <div class="play-overlay">
                <i class="fa-solid fa-play"></i>
                <span>WATCH SET</span>
            </div>
        </div>
    </div>
</section>

        <section id="tour-map">
            <h2 class="section-title">Locations</h2>
            <div id="map-container" class="map-placeholder" onclick="loadMap()">
                <span>CARICA MAPPA EVENTI</span>
            </div>
        </section>
    </div>
</main>

<script src="JS/main.js"></script>
</body>
</html>
